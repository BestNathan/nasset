[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nasset"
version = "0.1.0"
description = "Asset-to-cashflow analytics with option strategy matrices and a GitHub Pages dashboard"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "yfinance>=0.2.66,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
