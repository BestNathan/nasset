name: Deribit hourly market-data archive

on:
  push:
    branches: [main]
    # An explicit commit activating the archive also launches its first slot.
    # Archive and Daily data commits never match this trigger.
    paths: [config/market-data-activation.json]
  schedule:
    # UTC 43 minutes after each hour. Cron changed from 37 on 2026-11-06
    # to explicitly refresh scheduled workflow registration after missing ticks.
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Request Git publication (also requires checked-in activation=true)"
        type: boolean
        required: true
        default: false
      slot:
        description: "Optional exact current UTC hour YYYY-MM-DDTHH:00:00Z (AWS scheduler)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deribit-market-data-archive
  cancel-in-progress: false

jobs:
  read-only-acceptance:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      slot: ${{ steps.slot.outputs.slot }}
      enabled: ${{ steps.activation.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate repository-controlled production activation
        id: activation
        run: PYTHONPATH=src python -m nasset.deribit_activation

      - name: Pin UTC slot across acceptance and publication
        id: slot
        if: "${{ steps.activation.outputs.enabled == 'true' || github.event_name == 'workflow_dispatch' }}"
        env:
          REQUESTED_SLOT: ${{ inputs.slot }}
        run: |
          current_slot=$(date -u +'%Y-%m-%dT%H:00:00Z')
          # A delayed AWS scheduled invocation must not relabel current live
          # quotes as an earlier hour. Blank input preserves manual/native cron.
          if [ -n "$REQUESTED_SLOT" ] && [ "$REQUESTED_SLOT" != "$current_slot" ]; then
            echo "Refusing stale UTC slot: requested=$REQUESTED_SLOT current=$current_slot" >&2
            exit 1
          fi
          echo "slot=$current_slot" >> "$GITHUB_OUTPUT"

      - name: Install archive dependencies
        if: "${{ steps.activation.outputs.enabled == 'true' || github.event_name == 'workflow_dispatch' }}"
        run: pip install -e ".[archive]"

      - name: Verify Deribit live source contract
        if: "${{ steps.activation.outputs.enabled == 'true' || github.event_name == 'workflow_dispatch' }}"
        run: python -m nasset.deribit_probe --config config/market-data.yml

      - name: Build and validate due UTC-hour batch without Git writes
        if: "${{ steps.activation.outputs.enabled == 'true' || github.event_name == 'workflow_dispatch' }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m nasset.deribit_collect --config config/market-data.yml --at "${{ steps.slot.outputs.slot }}"

  publish:
    needs: read-only-acceptance
    # Every write requires main, successful read-only acceptance, and the
    # explicit versioned activation policy committed in the checkout.
    if: ${{ github.ref == 'refs/heads/main' && needs.read-only-acceptance.outputs.enabled == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install archive dependencies
        run: pip install -e ".[archive]"

      - name: Reject UTC rollover between acceptance and publication
        env:
          PINNED_SLOT: ${{ needs.read-only-acceptance.outputs.slot }}
        run: |
          if [ "$PINNED_SLOT" != "$(date -u +'%Y-%m-%dT%H:00:00Z')" ]; then
            echo "UTC slot expired before publication; refusing mislabeled quote" >&2
            exit 1
          fi

      - name: Publish complete due UTC-hour batch to orphan branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m nasset.deribit_collect --config config/market-data.yml --at "${{ needs.read-only-acceptance.outputs.slot }}" --publish
