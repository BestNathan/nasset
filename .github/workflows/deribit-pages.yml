name: Publish Deribit archive to GitHub Pages

on:
  workflow_run:
    workflows: ["Deribit hourly market-data archive"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nasset-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'BestNathan/nasset' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["workflow_dispatch","schedule","push"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Parquet projection dependencies
        run: pip install -e ".[archive]"

      - name: Verify market-data archive and build Pages JSON
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_deribit_dashboard.py

      - name: Fingerprint static Pages assets
        run: python scripts/stamp_pages_assets.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Deribit data is actually available
        env:
          NASSET_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/check_deribit_pages_live.py --site-url "$NASSET_PAGE_URL"
