name: AWS Deribit Scheduler deployment

# GitHub Actions repository secrets provide the dedicated AWS IAM deployment keys.
# Never make deployment credentials available to pull_request/fork workflows.
on:
  push:
    branches: [main]
    paths:
      - config/aws-deribit-scheduler.json
  workflow_dispatch:
    inputs:
      operation:
        description: "Reconcile config, inspect, temporarily disable, or destroy"
        type: choice
        required: true
        default: status
        options:
          - status
          - reconcile
          - disable
          - destroy
      confirm_destroy:
        description: "Confirm destruction (must disable first; SSM secret and logs stay)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: nasset-aws-deribit-scheduler-deploy
  cancel-in-progress: false

jobs:
  manage:
    # A feature branch or pull request must NEVER receive AWS deployment secrets.
    if: ${{ github.repository == 'BestNathan/nasset' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AWS_DEFAULT_REGION: ${{ vars.NASSET_AWS_REGION || 'ap-southeast-2' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Determine whether this operation needs AWS
        id: gate
        env:
          TRIGGER: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
        run: |
          if [ "$TRIGGER" = "push" ] || [ "$OPERATION" = "reconcile" ]; then
            state=$(python -c 'import runpy; print(runpy.run_path("scripts/aws_deribit_scheduler.py")["load_cloud_policy"]()["state"])')
            if [ "$state" = "not_deployed" ]; then
              echo "need_aws=false" >> "$GITHUB_OUTPUT"
              echo "AWS deployment not requested"
              exit 0
            fi
          fi
          echo "need_aws=true" >> "$GITHUB_OUTPUT"

      - name: Validate GitHub AWS deployment secrets
        if: ${{ steps.gate.outputs.need_aws == 'true' }}
        env:
          KEY: ${{ secrets.NASSET_AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.NASSET_AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$SECRET" ]; then
            echo "Configure NASSET_AWS_ACCESS_KEY_ID and NASSET_AWS_SECRET_ACCESS_KEY under GitHub Actions repository Secrets" >&2
            exit 1
          fi

      - name: Configure AWS IAM deployment credentials
        if: ${{ steps.gate.outputs.need_aws == 'true' }}
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ vars.NASSET_AWS_REGION || 'ap-southeast-2' }}
          aws-access-key-id: ${{ secrets.NASSET_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.NASSET_AWS_SECRET_ACCESS_KEY }}
          mask-aws-account-id: true
          unset-current-credentials: true
          role-session-name: nasset-${{ github.run_id }}

      - name: Install AWS SDK (deployment only, not collector)
        if: ${{ steps.gate.outputs.need_aws == 'true' }}
        run: pip install "boto3>=1.35,<2"

      - name: Reconcile Git-managed desired state
        if: ${{ github.event_name == 'push' || inputs.operation == 'reconcile' }}
        env:
          NASSET_GITHUB_DISPATCH_TOKEN: ${{ secrets.NASSET_GITHUB_DISPATCH_TOKEN }}
        run: python scripts/aws_deribit_scheduler.py reconcile

      - name: Inspect deployed schedule
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'status' }}
        run: python scripts/aws_deribit_scheduler.py status

      - name: Emergency disable schedule
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'disable' }}
        run: python scripts/aws_deribit_scheduler.py disable

      - name: Confirm explicit teardown
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'destroy' }}
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [ "$CONFIRM_DESTROY" != "true" ]; then
            echo "Refusing AWS teardown without confirm_destroy=true" >&2
            exit 1
          fi

      - name: Destroy managed resources (requires already disabled)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'destroy' }}
        run: python scripts/aws_deribit_scheduler.py destroy --confirm-destroy
