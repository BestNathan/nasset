name: Daily asset cashflow snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "site/data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nasset-pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Generate daily snapshot
        run: python -m nasset --root .

      - name: Generate dividend topic history
        run: python scripts/build_topics_dividends.py

      - name: Verify dividend research coverage
        run: |
          python - <<'PY'
          import json
          d = json.load(open("site/data/topics-dividends.json"))
          assert d["universe_size"] == 78
          assert d["coverage"]["fresh_dividends"] + d["coverage"]["stale_dividends"] > 0
          PY

      - name: Persist daily history
        run: |
          git config user.name "nasset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: daily asset snapshot $(date -u +%F)"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
