name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "site/data/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,archive]"
      - run: pytest -q
      - name: Check static Deribit viewer syntax
        run: node --check site/deribit.js
      - name: Compute model surfaces from actual verified market-data archive
        if: github.repository == 'BestNathan/nasset'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/build_deribit_dashboard.py --output /tmp/deribit-research.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/deribit-research.json"))
          assert data["analytics"]["model"].startswith("Black-76")
          assets = data["analytics"]["assets"]
          for coin in ("BTC", "ETH"):
              products = assets[coin]["markets"]
              assert products
              assert any(p["contracts"] > 20 for p in products.values())
              assert any(p["expiries"] for p in products.values())
              assert any(p["risk"]["metrics"]["gamma_1pct_usd"] > 0 for p in products.values())
          assert assets["PAXG"]["markets"] == {}
          assert assets["PAXG"]["futures"]
          print("live archive research projection:", data["analytics"]["as_of"])
          PY
