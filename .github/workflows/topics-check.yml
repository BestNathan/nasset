name: Topic quality gate
on:
  pull_request:
    paths:
      - "scripts/build_topics_dividends.py"
      - "tests/test_topics.py"
      - "data/topics-universe.json"
      - "data/topics-dividend-corrections.json"
      - "site/topics.*"
      - ".github/workflows/topics-check.yml"
      - ".github/workflows/daily.yml"
      - "pyproject.toml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencies
        run: pip install -e ".[dev]"
      - name: Python tests
        run: pytest -q
      - name: Static JS syntax
        run: node --check site/topics.js
      - name: Frontend smoke fixture
        run: node tests/test_topics_ui.cjs
      - name: Python compile
        run: python -m py_compile scripts/build_topics_dividends.py

  full-data-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencies
        run: pip install -e ".[dev]"
      - name: Run full historical build
        env:
          TOPICS_WORKERS: "5"
        run: python scripts/build_topics_dividends.py
      - name: Assert factual coverage
        run: |
          python - <<'PY'
          import json
          d=json.load(open("site/data/topics-dividends.json"))
          coverage=d["coverage"]
          print("Coverage:", coverage, "Universe:", d["universe_size"])
          assert d["universe_size"] == 78
          assert coverage["fresh_dividends"] >= 65, "insufficient successful dividend coverage"
          assert coverage["priced"] >= 65, "insufficient successful price coverage"
          assert len(d["stocks"]) == 78
          assert d["stocks"]["600900.SS"]["years"]["2015"] == 0.4
          assert 9.5 < d["stocks"]["600900.SS"]["statistics"]["cagr_pct"] < 9.7
          for code,stock in d["stocks"].items():
              for yr,amount in stock.get("years", {}).items():
                  assert 2015 <= int(yr) <= 2025 and amount >= 0, code
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser UI verification and screenshots
        run: |
          python -m http.server 8765 --directory site >/tmp/nasset-topics-http.log 2>&1 &
          node tests/topics_browser.cjs
      - name: Upload Pages screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: topic-browser-acceptance
          path: artifacts/topics-*.png
      - name: Upload integration snapshot for auditing
        uses: actions/upload-artifact@v4
        with:
          name: topic-data-integration
          path: |
            site/data/topics-dividends.json
            site/data/topics-universe.json
