name: Topic quality gate
on:
  pull_request:
    paths:
      - "scripts/build_topics_dividends.py"
      - "tests/test_topics.py"
      - "data/topics-universe.json"
      - "site/topics.*"
      - ".github/workflows/topics-check.yml"
      - ".github/workflows/daily.yml"
      - "pyproject.toml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencies
        run: pip install -e ".[dev]"
      - name: Python tests
        run: pytest -q
      - name: Static JS syntax
        run: node --check site/topics.js
      - name: Python compile
        run: python -m py_compile scripts/build_topics_dividends.py
