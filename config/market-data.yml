# Market-data archive configuration (target design; collector not yet deployed).
# Reference: docs/market-data.md and GitHub issue #6
version: 1

storage:
  branch: market-data
  format: parquet
  compression: zstd
  compression_level: 6

sources:
  deribit:
    enabled: true
    # Underlying/base assets, NOT the API settlement currency.
    # PAXG derivatives are discoverable; skip unavailable per-dataset products
    # only after recording explicit capability/coverage status.
    underlyings: [BTC, ETH, PAXG]
    datasets:
      # Hourly current-market snapshots, taken at minute 37 UTC.
      option_chain:
        enabled: true
        interval_hours: 1
        # PAXG currently has a listed future but no active options.
        # Verify the complete instrument catalog every run and persist a
        # per-slot unlisted-capability manifest instead of inventing quotes.
        # BTC/ETH missing contracts remain fatal.
        allow_unlisted: [PAXG]

      index_price:
        enabled: true
        interval_hours: 1
        # Discover full names actually referenced by live instruments
        # and cross-check Deribit-supported names (e.g., btc_usd, btc_usdc).
        index_names: auto

      # Record only new, immutable native settlement events; no need to
      # resave historical settlement series every hour.
      delivery_price:
        enabled: true
        interval_hours: 24
        index_names: auto

      # P1: Deribit DVOL is only requested for explicitly supported assets.
      # PAXG is NOT automatically added to the DVOL series.
      volatility_index:
        enabled: true
        interval_hours: 1
        underlyings: [BTC, ETH]
        resolution: "3600"

      # Poll the source daily, persist only new source-timestamped points.
      # Do not infer PAXG support from the common asset universe.
      historical_volatility:
        enabled: true
        interval_hours: 24
        underlyings: [BTC, ETH]

      # Discover actual listed futures/perpetual contracts for all
      # configured underlyings, including PAXG where available.
      futures_curve:
        enabled: true
        interval_hours: 1

      # P2: separate future scope; disabled by default.
      funding_rate:
        enabled: false
        interval_hours: 8
