# Production Deribit market-data configuration; enable/disable via config/market-data-activation.json.
# Reference: docs/market-data.md and GitHub issue #6
version: 1

storage:
  branch: market-data
  format: parquet
  compression: zstd
  compression_level: 6

sources:
  deribit:
    enabled: true
    # Underlying/base assets, NOT the API settlement currency.
    # Retain PAXG index/settlement/futures data; do not collect PAXG options.
    underlyings: [BTC, ETH, PAXG]
    datasets:
      # Hourly current-market snapshots, taken at minute 37 UTC.
      option_chain:
        enabled: true
        interval_hours: 1
        # BTC/ETH only. PAXG options were delisted; keep its other
        # configured datasets independent of option-chain quote coverage.
        underlyings: [BTC, ETH]

      index_price:
        enabled: true
        interval_hours: 1
        # Discover full names actually referenced by live instruments
        # and cross-check Deribit-supported names (e.g., btc_usd, btc_usdc).
        index_names: auto

      # Record only new, immutable native settlement events; no need to
      # resave historical settlement series every hour.
      delivery_price:
        enabled: true
        interval_hours: 24
        index_names: auto

      # P1: Deribit DVOL is only requested for explicitly supported assets.
      # PAXG is NOT automatically added to the DVOL series.
      volatility_index:
        enabled: true
        interval_hours: 1
        underlyings: [BTC, ETH]
        resolution: "3600"

      # Poll the source daily, persist only new source-timestamped points.
      # Do not infer PAXG support from the common asset universe.
      historical_volatility:
        enabled: true
        interval_hours: 24
        underlyings: [BTC, ETH]

      # Discover actual listed futures/perpetual contracts for all
      # configured underlyings, including PAXG where available.
      futures_curve:
        enabled: true
        interval_hours: 1

      # Curated Deribit RWA perpetual registry (official contract specifications).
      # API discovers actual listings; an empty listing is stored as zero rows.
      # Do not mix these with BTC/ETH/PAXG crypto derivatives. Add newly
      # announced tickers here only after verifying their RWA category.
      rwa_perpetual:
        enabled: true
        interval_hours: 1
        categories:
          equity: [AAOI, AAPL, AMD, AMZN, ARM, AVGO, BE, BMNR, CBRS, CRCL, CRWV, DELL, GOOGL, HOOD, INTC, LITE, META, MRVL, MSFT, MSTR, MU, NBIS, NVDA, ORCL, PLTR, RKLB, SKHY, SNDK, SPCX, TSLA, TSM, WDC]
          equity_etf: [DRAM, EWY, KORU, QQQ, SNXX, SOXL, SOXS, SPY]
          commodity: [BRENTOIL, GOLD, SILVER, WTIOIL]
          pre_ipo: [ANTH, OPENAI]

      # P2: separate future scope; disabled by default.
      funding_rate:
        enabled: false
        interval_hours: 8
